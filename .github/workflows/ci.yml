name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: |
          git ls-files '*.cpp' '*.hpp' '*.h' \
            | xargs --no-run-if-empty clang-format-18 --dry-run --Werror

  build:
    name: ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [linux-debug-werror, linux-release]
        include:
          - compiler: gcc
            cc: gcc-14
            cxx: g++-14
            package: g++-14
          - compiler: clang
            cc: clang-18
            cxx: clang++-18
            package: clang-18
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ${{ matrix.package }}

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ hashFiles('cmake/ProjectDependencies.cmake', 'cmake/CPM.cmake') }}

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.compiler }}-${{ matrix.preset }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  sanitizers:
    name: clang / ASan + UBSan
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ hashFiles('cmake/ProjectDependencies.cmake', 'cmake/CPM.cmake') }}

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: clang-sanitizers

      - name: Configure
        run: cmake --preset linux-debug-sanitizers

      - name: Build
        run: cmake --build --preset linux-debug-sanitizers

      - name: Test
        run: ctest --preset linux-debug-sanitizers

  analysis:
    name: clang-tidy + cppcheck
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 clang-tidy cppcheck

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ hashFiles('cmake/ProjectDependencies.cmake', 'cmake/CPM.cmake') }}

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: clang-analysis

      - name: Configure
        run: cmake --preset linux-debug-analysis

      - name: Build (runs analyzers)
        run: cmake --build --preset linux-debug-analysis

      - name: Test
        run: ctest --preset linux-debug-analysis